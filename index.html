<!DOCTYPE html><html lang="ko" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="LP Player"><meta name="theme-color" content="#120b14"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>LP Player</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--S:min(calc((100vw - 32px)/2),330px,calc(36dvh))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[data-theme=dark]{--txt:#f4efff;--sub:rgba(244,239,255,.65);--ov:var(--dk);--card:#1b1822;--ink:#efeaf7;--ctl:rgba(255,255,255,.1)}
body{--acc:#22e3ff;--dk:rgba(8,6,24,.84);margin:0;min-height:100dvh;background:#0a0620;color:var(--txt);font-family:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;overflow-x:hidden;transition:color .6s}
body[data-album=A]{--acc:#f2b134;--dk:rgba(30,13,12,.76)}
body[data-album=B]{--acc:#ff2fa8;--dk:rgba(10,10,44,.72)}
.bgs{position:fixed;inset:0;z-index:0;overflow:hidden}
.bgs>div{position:absolute;inset:-25%;opacity:0;transition:opacity 1s;will-change:opacity}
.bg0{opacity:1!important;background:repeating-linear-gradient(115deg,transparent 0 40px,rgba(34,227,255,.5) 41px 44px,transparent 45px 90px,rgba(255,47,168,.55) 92px 98px,transparent 99px 160px,rgba(139,61,255,.5) 162px 170px,transparent 172px 250px),linear-gradient(115deg,#0b1a4a,#5a1a8c 40%,#c21a86 70%,#0b1a4a);background-size:600px 600px,100% 100%;filter:blur(26px) saturate(1.2);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-4%,3%) scale(1.06)}}
@keyframes flow{to{background-position:600px 0,0 0}}
.bgA{background:radial-gradient(circle at 50% 40%,#b9741a,#4a1c12 45%,#1a0a0c 80%)}
.bgB{background:radial-gradient(circle at 30% 30%,#2a2bff,#7a1a9c 50%,#12062a 90%)}
.bgs img{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;object-fit:cover;filter:blur(8px) saturate(1.7);transform:scale(9)}
body[data-album=""] .bgS,body[data-album=A] .bgA,body[data-album=B] .bgB{opacity:1}
.bgs::after{content:"";position:absolute;inset:0;background:var(--ov);transition:background .6s}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:10px 16px calc(84px + env(safe-area-inset-bottom,0px));min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:14px}
header{width:100%;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:16px;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--ctl);color:var(--txt);display:grid;place-items:center;cursor:pointer;transition:background .2s,box-shadow .2s,transform .15s}
.ib svg{width:22px;height:22px;fill:currentColor}.ib:active{transform:scale(.92)}
.ib.on{background:var(--acc);color:#111;box-shadow:0 0 18px var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.shelf{display:flex;gap:16px;justify-content:center;width:100%;transition:gap .5s}
.album{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;width:min(44vw,260px);display:flex;flex-direction:column;align-items:center;gap:8px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.album .c{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 28px rgba(0,0,0,.45);transition:box-shadow .4s,transform .4s}
.album img{width:100%;height:100%;object-fit:contain;display:block}
.album b{font-size:14px;font-weight:700;text-align:center}
.album[aria-pressed=true] .c{box-shadow:0 0 0 2px var(--acc),0 0 26px var(--acc)}
body.open .album{width:min(25vw,108px)}body.open .album b{font-size:12px}body.open .shelf{gap:12px}
.wrap{perspective:1700px;width:100%;display:flex;justify-content:center;height:calc(var(--S) * 1.5)}
.wrap[hidden]{display:none}
.stage{position:relative;width:calc(var(--S) * 2);height:var(--S);margin-top:calc(var(--S) * .25);transform-style:preserve-3d;transform:translateX(calc(var(--S) / 2)) scale(1.4);transition:transform 1s cubic-bezier(.5,0,.2,1)}
.stage.open{transform:none}
.base{position:absolute;left:var(--S);top:0;width:var(--S);height:var(--S);border-radius:0 14px 14px 0;background:var(--card);box-shadow:0 14px 40px rgba(0,0,0,.5);overflow:hidden}
.lp{position:absolute;left:6%;top:6%;width:88%;aspect-ratio:1;border-radius:50%;opacity:0;transform:translateX(-45%) scale(.8);transition:opacity .6s .5s,transform .9s cubic-bezier(.2,.9,.2,1) .6s;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.open .lp{opacity:1;transform:none}
.disc{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:#111;animation:spin 5s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.disc img{width:100%;height:100%;object-fit:contain;transform:scale(.71);opacity:1;border-radius:6%;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:1;background:repeating-radial-gradient(circle,transparent 0 4px,rgba(255,255,255,.13) 5px 6px)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:13%;height:13%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#fff,#aaa);box-shadow:0 0 0 5px rgba(0,0,0,.55);z-index:2}
.arm{position:absolute;right:9%;top:7%;width:8px;height:58%;margin-right:-4px;border-radius:6px;background:linear-gradient(90deg,#8a8a92,#fff,#8a8a92);transform-origin:50% 0;transform:rotate(-10deg);transition:transform 1.3s cubic-bezier(.4,0,.2,1);z-index:3;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.arm::before{content:"";position:absolute;top:-9px;left:-8px;width:24px;height:24px;border-radius:50%;background:radial-gradient(#fff,#999)}
.arm::after{content:"";position:absolute;bottom:-14px;left:-5px;width:18px;height:22px;border-radius:4px;background:#ddd;border:2px solid #888}
.playing .arm{transform:rotate(26deg)}
.cover{position:absolute;left:var(--S);top:0;width:var(--S);height:var(--S);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.open .cover{transform:rotateY(-180deg)}
.cover>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden}
.front{background:#000;box-shadow:0 14px 40px rgba(0,0,0,.5)}.front img{width:100%;height:100%;object-fit:contain;display:block}
.back{transform:rotateY(180deg);background:#000;color:#fff;border-radius:14px 0 0 14px}.back>img{width:100%;height:100%;object-fit:contain;display:block}.back .ov{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.88));display:flex;flex-direction:column;gap:2px}
.back h2{margin:0;font-size:clamp(15px,4.2vw,22px);line-height:1.15}
.back p{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--acc)}
.back small{font-size:11px;opacity:.6}
.front .x{position:absolute;right:6px;top:6px;width:44px;height:44px;background:rgba(0,0,0,.55);color:#fff}
.back .file{margin-top:auto;font-size:12px;font-weight:600;padding:8px 10px;border-radius:16px;background:var(--ctl);cursor:pointer;text-align:center}
.file input{display:none}
.panel{width:100%;max-width:560px;display:flex;flex-direction:column;gap:6px;position:relative}
.panel[hidden]{display:none}
.now{text-align:center}.now b{display:block;font-size:15px}.now span{font-size:12px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
input[type=range]{flex:1;accent-color:var(--acc);height:28px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.row .ib{width:52px;height:52px}.row .ib svg{width:24px;height:24px}
#play{width:64px;height:64px;background:var(--acc);color:#111;box-shadow:0 0 22px var(--acc)}
.vol{position:absolute;right:0;bottom:68px;width:180px;padding:6px 12px;border-radius:24px;background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.vol[hidden]{display:none}
.mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.5);transform:translateY(140%);transition:transform .5s;max-width:560px;margin:0 auto}
.mini.show{transform:none}.mini img{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#000;cursor:pointer}
.mini div{flex:1;min-width:0;cursor:pointer}.mini b,.mini span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini b{font-size:14px}.mini span{font-size:12px;opacity:.6}
.mini .ib{background:var(--acc);color:#111}
ol.tl{list-style:none;margin:6px 0 0;padding:0;max-height:18dvh;overflow:auto;border-radius:14px;background:var(--ctl)}
.tl button{width:100%;text-align:left;border:0;background:none;color:var(--txt);font:inherit;font-size:13px;padding:11px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl button.cur{color:var(--acc);font-weight:700}
body[data-album=A] .bg0,body[data-album=B] .bg0{animation-play-state:paused}
body .bg0{opacity:.5!important}
.bgS img{margin:-100px 0 0 -100px;transform:scale(7);opacity:.5}.bgS img:first-child{left:33%}.bgS img:last-child{left:67%}
.base{opacity:0;transition:opacity .6s .4s;z-index:1}.open .base{opacity:1}
.lp{left:calc(var(--S)*1.06);top:calc(var(--S)*.06);width:calc(var(--S)*.88);z-index:2;opacity:1;transform:translateX(calc(var(--S)*-1));transition:transform 1s cubic-bezier(.2,.8,.2,1) .55s}
.open .lp{transform:none}
.cover{left:0;z-index:3;transform:none!important}
.arm{z-index:4;right:calc(var(--S)*.09);top:calc(var(--S)*.07);height:calc(var(--S)*.58)}
.now small{display:block;color:var(--sub);font-size:12px}
.now .file{display:inline-block;font-size:12px;font-weight:600;padding:8px 12px;border-radius:16px;background:var(--ctl);cursor:pointer;margin:4px 0 0}
.stage,.cover,.lp,.disc,.arm{will-change:transform}

body[data-album=A] .disc img,body[data-album=B] .disc img{transform:scale(1.12);opacity:1}
body[data-album=B] .disc{background:radial-gradient(circle,#2a2530,#0e0c12)}
@media(prefers-reduced-motion:reduce){.bg0{animation:none}}
</style></head><body data-album="">

 $('play').classList.toggle('on',on);$('play').setAttribute('aria-label',on?'일시정지':'재생');
 if('mediaSession' in navigator)navigator.mediaSession.playbackState=on?'playing':'paused'}
function fill(k){const A0=albums[k],tr=A0.tracks[A0.i],a={title:A0.title,artist:tr.a,song:tr.t,blob:tr.blob,src:tr.src},img=cov(k),f='none';
 $('title').textContent=a.title;$('artist').textContent=a.artist;$('now').textContent=a.song;$('nowArtist').textContent=a.artist+' · '+a.title;
 ['discImg','frontImg','miniImg'].forEach(i=>{if($(i).dataset.k!==k){$(i).src=img;$(i).dataset.k=k;$(i).style.filter=f}});
 $('miniT').textContent=a.song;$('miniA').textContent=a.artist;$('hint').textContent=(a.blob||a.src.startsWith('audio/'))?'':'이 앨범은 아직 음원이 없어요';$('file').parentNode.style.display=k==='A'?'none':'';
 if(a.blob||a.src){au.src=a.blob||url(a.src);au.load()}else{au.removeAttribute('src');au.load()}$('seek').value=0;$('cur').textContent='0:00';
 if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:a.song,artist:a.artist,album:a.title,artwork:[{src:img,sizes:'640x640'}]})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function closeAlbum(){if(!isOpen||busy)return;busy=true;stage.classList.remove('open');await wait(1000);$('wrap').hidden=true;$('panel').hidden=true;body.classList.remove('open');isOpen=false;$('mini').classList.toggle('show',!!cur);busy=false}
async function openAlbum(k,auto){if(busy)return;busy=true;
 if(cur&&cur!==k){au.pause();setPlaying(false)}
 cur=k;fill(k);list();body.dataset.album=k;
 document.querySelectorAll('.album').forEach(b=>b.setAttribute('aria-pressed',b.id===k));
 body.classList.add('open');$('mini').classList.add('show');$('wrap').hidden=false;$('panel').hidden=false;isOpen=true;
 stage.classList.remove('open');void stage.offsetWidth;await wait(450);stage.classList.add('open');busy=false;
 if(auto)au.play().catch(()=>{});}
async function choose(k,auto){if(isOpen&&cur===k)return closeAlbum();if(isOpen){await closeAlbum()}openAlbum(k,auto)}
order.forEach(k=>$(k).onclick=()=>choose(k));
$('close').onclick=closeAlbum;$('miniOpen').onclick=()=>cur&&choose(cur);$('miniImg').onclick=()=>cur&&choose(cur);
function toggle(){if(!cur)return;au.paused?au.play().catch(()=>{$('hint').textContent=cur==='A'?'재생에 실패했어요. 다시 눌러 주세요'+(au.error?' (코드 '+au.error.code+')':''):'재생할 음원이 없습니다. 음원 불러오기를 눌러 주세요'}):au.pause()}
$('play').onclick=toggle;$('miniPlay').onclick=toggle;
function step(d){if(!cur)return;const A=albums[cur];if(d<0&&au.currentTime>3){au.currentTime=0;return}A.i=(A.i+d+A.tracks.length)%A.tracks.length;fill(cur);list();au.play().catch(()=>{})}
function list(){const A=albums[cur];$('tl').innerHTML='';A.tracks.forEach((t,n)=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=(n+1)+'. '+t.t+' — '+t.a;if(n===A.i)b.className='cur';b.onclick=()=>{A.i=n;fill(cur);list();au.play().catch(()=>{})};li.appendChild(b);$('tl').appendChild(li)});const c=$('tl').querySelector('.cur');if(c)c.scrollIntoView({block:'nearest'})}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('rep').onclick=()=>{au.loop=!au.loop;$('rep').classList.toggle('on',au.loop);$('rep').setAttribute('aria-pressed',au.loop)};
$('volb').onclick=()=>$('vol').hidden=!$('vol').hidden;$('volr').oninput=e=>au.volume=e.target.value;
au.onerror=()=>{const s=au.getAttribute('src')||'';if(s.startsWith('audio/')&&!tried[s]){tried[s]=1;$('hint').textContent='곡을 내려받는 중…';
 fetch(s,{credentials:'include'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(b=>{cache[s]=URL.createObjectURL(new Blob([b],{type:'audio/mp4'}));au.src=cache[s];au.load();$('hint').textContent='';au.play().catch(()=>{$('hint').textContent='재생 버튼을 한 번 더 눌러 주세요'})}).catch(e=>{$('hint').textContent='음원을 불러오지 못했어요 ('+e.message+')'});return}
 if(cur==='A')$('hint').textContent='음원을 불러오지 못했어요 (코드 '+(au.error?au.error.code:'?')+')'};au.onplay=()=>{setPlaying(true);if(cur==='A')$('hint').textContent=''};au.onpause=()=>setPlaying(false);au.onended=()=>{if(!au.loop){if(albums[cur].tracks.length>1)step(1);else{setPlaying(false);au.currentTime=0}}};
au.onloadedmetadata=()=>$('dur').textContent=fmt(au.duration);
au.ontimeupdate=()=>{$('cur').textContent=fmt(au.currentTime);if(au.duration)$('seek').value=au.currentTime/au.duration*100};
$('seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
$('file').onchange=e=>{const f=e.target.files[0];if(!f||!cur)return;const t=albums[cur].tracks[albums[cur].i];if(t.blob)URL.revokeObjectURL(t.blob);
 t.blob=URL.createObjectURL(f);t.t=f.name.replace(/\.[^.]+$/,'');fill(cur);list();au.play().catch(()=>{})};
if('mediaSession' in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());
 m.setActionHandler('previoustrack',()=>step(-1));m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('seekto',d=>{au.currentTime=d.seekTime})}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
